
services:
  postgres:
    image: postgres:17
    container_name: linkboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkboard
      POSTGRES_PASSWORD: linkboard_dev
      POSTGRES_DB: linkboard
    ports:
     - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkboard -d linkboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: